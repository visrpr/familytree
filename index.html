<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prabhu Family Tree</title>
<style>
:root{--ink:#29261f;--muted:#7c7467;--paper:#f5f1e8;--line:#b9ab91;--accent:#987948}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}body{overflow:hidden}

header{height:100px;padding:20px 32px;border-bottom:1px solid #ded5c5;position:relative;z-index:3;background:var(--paper)}
.kicker{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1{font:400 clamp(24px,3vw,36px) Georgia,serif;margin:2px 0}.subtitle{font-size:12px;color:var(--muted)}
.controls{position:absolute;right:28px;bottom:20px;display:flex;gap:6px}
button{border:1px solid #d8cfbf;background:#fffdf8;border-radius:8px;padding:6px 12px;color:var(--ink);cursor:pointer}

.viewport{height:calc(100vh - 100px);overflow:auto;cursor:grab}.viewport.dragging{cursor:grabbing}
.canvas{position:relative;width:max-content;min-width:100%;min-height:100%;padding:80px;transform-origin:top left}

#tree-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
#tree-svg path{fill:none;stroke:var(--line);stroke-width:1.5px}

.tree-container{position:relative;z-index:2;display:flex;justify-content:center}
.branch{display:flex;flex-direction:column;align-items:center}
.children{display:flex;gap:36px;margin-top:70px}

.person{width:140px;text-align:center;position:relative}
.photo{width:96px;height:96px;margin:auto;border-radius:50%;border:1px solid #bba98b;background:linear-gradient(145deg,#e2dccf,#c1b6a1);position:relative;box-shadow:0 8px 18px #493a2812}
.photo:before{content:"";position:absolute;left:40%;top:24%;width:21%;height:21%;border-radius:50%;background:#8e8575aa}
.photo:after{content:"";position:absolute;left:27%;bottom:11%;width:46%;height:42%;border-radius:50% 50% 42% 42%;background:#8e857566}
.name{font:400 14px/1.25 Georgia,serif;margin-top:8px;min-height:35px}
.years{font-size:11px;color:var(--muted);margin-top:2px}
.relation{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#9a8768;margin-bottom:4px;font-weight:600}

.root-person{width:170px}
.root-person .photo{width:130px;height:130px}
.root-person .name{font-size:18px}
</style></head>
<body>
<header>
  <div class="kicker">Family Archive</div>
  <h1>Prabhu Family Tree</h1>
  <div class="subtitle">A living record of the Prabhu family</div>
  <div class="controls">
    <button id="out">−</button>
    <button id="reset">100%</button>
    <button id="in">+</button>
    <button id="fit">Fit tree</button>
  </div>
</header>
<main class="viewport" id="viewport">
  <div class="canvas" id="canvas">
    <svg id="tree-svg"></svg>
    <div class="tree-container" id="tree"></div>
  </div>
</main>
<script src="family-data.js"></script>
<script>
const data = window.FAMILY_DATA || [], 
      byId = Object.fromEntries(data.map(p => [p.id, p])), 
      treeContainer = document.getElementById("tree"),
      svg = document.getElementById("tree-svg"),
      canvas = document.getElementById("canvas"),
      vp = document.getElementById("viewport");

let cardElements = {}, scale = 1;

function rel(parent, child) { 
    return child.gender === "female" ? "Daughter" : child.gender === "male" ? "Son" : "Child"; 
}

function createBranch(id, parentObj = null) {
    const p = byId[id];
    if (!p) return null;

    const branch = document.createElement("div");
    branch.className = "branch";

    const isRoot = (id === "padmanabh");
    const card = document.createElement("div");
    card.className = isRoot ? "person root-person" : "person";
    cardElements[p.id] = card;

    const label = parentObj ? rel(parentObj, p) : "";
    card.innerHTML = `<div class="relation">${label || "&nbsp;"}</div><div class="photo"></div><div class="name">${p.name}</div><div class="years">—</div>`;
    branch.appendChild(card);

    const kids = (p.children || []).map(kId => byId[kId]).filter(Boolean);
    if (kids.length > 0) {
        const childrenContainer = document.createElement("div");
        childrenContainer.className = "children";
        kids.forEach(k => {
            const childBranch = createBranch(k.id, p);
            if (childBranch) childrenContainer.appendChild(childBranch);
        });
        branch.appendChild(childrenContainer);
    }
    return branch;
}

function drawLines() {
    svg.innerHTML = "";
    const canvasRect = canvas.getBoundingClientRect();

    data.forEach(parent => {
        if (!parent.children || !parent.children.length) return;
        const parentEl = cardElements[parent.id];
        if (!parentEl) return;

        const pRect = parentEl.getBoundingClientRect();
        const pX = (pRect.left + pRect.width / 2 - canvasRect.left) / scale;
        const pY = (pRect.bottom - canvasRect.top) / scale;

        parent.children.forEach(childId => {
            const childEl = cardElements[childId];
            if (!childEl) return;

            const cRect = childEl.getBoundingClientRect();
            const cX = (cRect.left + cRect.width / 2 - canvasRect.left) / scale;
            const cY = (cRect.top - canvasRect.top) / scale;

            const midY = pY + (cY - pY) / 2;
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M ${pX} ${pY} V ${midY} H ${cX} V ${cY}`);
            svg.appendChild(path);
        });
    });
}

function renderTree() {
    treeContainer.innerHTML = "";
    cardElements = {};
    const rootBranch = createBranch("padmanabh");
    if (rootBranch) treeContainer.appendChild(rootBranch);
    setTimeout(drawLines, 30);
}

function applyScale() { 
    canvas.style.transform = `scale(${scale})`; 
    document.getElementById("reset").textContent = Math.round(scale * 100) + "%"; 
    drawLines();
}

document.getElementById("in").onclick = () => { scale = Math.min(1.7, scale + 0.1); applyScale(); };
document.getElementById("out").onclick = () => { scale = Math.max(0.35, scale - 0.1); applyScale(); };
document.getElementById("reset").onclick = () => { scale = 1; applyScale(); };
document.getElementById("fit").onclick = () => { 
    scale = Math.max(0.35, Math.min(1, (vp.clientWidth - 40) / canvas.scrollWidth, (vp.clientHeight - 40) / canvas.scrollHeight)); 
    applyScale(); 
    vp.scrollTo(0, 0); 
};

let drag = false, sx, sy, sl, st;
vp.onpointerdown = e => { drag = true; vp.classList.add("dragging"); sx = e.clientX; sy = e.clientY; sl = vp.scrollLeft; st = vp.scrollTop; vp.setPointerCapture(e.pointerId); };
vp.onpointermove = e => { if (drag) { vp.scrollLeft = sl - e.clientX + sx; vp.scrollTop = st - e.clientY + sy; } };
vp.onpointerup = () => { drag = false; vp.classList.remove("dragging"); };

renderTree();
window.onresize = drawLines;
</script></body></html>
