<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prabhu Family Tree</title>
<style>
:root{--ink:#29261f;--muted:#7c7467;--paper:#f5f1e8;--card:#fffdf8;--line:#b9ab91;--accent:#987948}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}

header{flex:0 0 auto;padding:22px 32px 16px;border-bottom:1px solid #ded5c5;background:#f5f1e8;position:relative;z-index:6}
.kicker{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1{font:400 clamp(26px,4vw,42px) Georgia,serif;margin:4px 0}
.subtitle{font-size:12px;color:var(--muted)}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.searchwrap{position:relative;flex:1 1 220px;max-width:320px}
#search{width:100%;padding:8px 12px;border:1px solid #d8cfbf;border-radius:9px;background:#fffdf8;color:var(--ink);font-size:13px}
#search:focus{outline:2px solid var(--accent);outline-offset:1px}
#searchResults{position:absolute;top:38px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 10px 24px #29261f22;display:none;z-index:8}
#searchResults div{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #ede6d6}
#searchResults div:last-child{border-bottom:none}
#searchResults div:hover,#searchResults div.active{background:#f0ead9}
#searchResults .none{color:var(--muted);cursor:default}
#searchResults .rel{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-left:6px}

.toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);user-select:none;cursor:pointer}
.toggle input{accent-color:var(--accent)}

.controls{display:flex;gap:6px;margin-left:auto}
button{border:1px solid #d8cfbf;background:#fffdf8;border-radius:9px;padding:8px 11px;color:var(--ink);cursor:pointer;font-size:13px}
button:hover{background:#efe8d8}

.viewport{flex:1 1 auto;overflow:auto;cursor:grab;position:relative}
.viewport.dragging{cursor:grabbing}
.canvas{min-width:3000px;min-height:1900px;padding:90px 100px;transform-origin:top left}

.tree{display:flex;flex-direction:column;align-items:center;gap:70px}
.generation{display:flex;justify-content:center;gap:30px}
.person{width:150px;text-align:center;position:relative;cursor:pointer;border-radius:10px;transition:background .2s ease}
.person:hover{background:#ecdfc255}
.person[data-unknown="true"]{opacity:.55}
.hide-unknown .person[data-unknown="true"]{display:none}

.photo{width:108px;height:108px;margin:auto;border-radius:50%;border:1px solid #bba98b;background:linear-gradient(145deg,#e2dccf,#c1b6a1);position:relative;box-shadow:0 9px 22px #493a2815;overflow:hidden}
.photo:before{content:"";position:absolute;left:40%;top:24%;width:21%;height:21%;border-radius:50%;background:#8e8575aa}
.photo:after{content:"";position:absolute;left:27%;bottom:11%;width:46%;height:42%;border-radius:50% 50% 42% 42%;background:#8e857566}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;z-index:2}
.photo.has-photo:before,.photo.has-photo:after{display:none}

.name{font:400 15px/1.25 Georgia,serif;margin-top:11px;min-height:38px}
.years{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:3px}
.relation{font-size:8px;text-transform:uppercase;letter-spacing:.16em;color:#9a8768;height:13px;margin-bottom:5px}

.root .person{width:190px}.root .photo{width:145px;height:145px}.root .name{font-size:20px}

.family{position:relative;padding-top:68px}
.family:before{content:"";position:absolute;top:0;left:50%;height:68px;border-left:1px solid var(--line)}
.children{display:flex;gap:26px;justify-content:center;position:relative}
.children:before{content:"";position:absolute;top:0;left:4%;right:4%;height:1px;background:var(--line)}
.children .person:before{content:"";position:absolute;top:-68px;left:50%;height:68px;border-left:1px solid var(--line)}
.nested{margin-top:78px}.nested>.family{padding-top:55px}.nested>.family:before{height:55px}.nested .children .person:before{top:-55px;height:55px}

@keyframes pulse{0%{box-shadow:0 0 0 0 #98794877}70%{box-shadow:0 0 0 16px #98794800}100%{box-shadow:0 0 0 0 #98794800}}
.person.highlight .photo{animation:pulse 1.4s ease}

#overlay{position:fixed;inset:0;background:#29261f33;opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:9}
#overlay.open{opacity:1;pointer-events:auto}
#detail{position:fixed;left:50%;bottom:-100%;transform:translateX(-50%);width:min(420px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -14px 34px #29261f2e;padding:22px 26px 28px;transition:bottom .35s ease;z-index:10}
#detail.open{bottom:0}
#detail .dclose{position:absolute;top:10px;right:14px;background:none;border:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
#detail .drel{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent)}
#detail h2{font:400 24px Georgia,serif;margin:6px 0 2px}
#detail .dyears{font-size:12px;color:var(--muted);letter-spacing:.06em}
#detail .drow{font-size:13px;margin-top:12px;padding-top:12px;border-top:1px solid #ede6d6}
#detail .drow b{color:var(--muted);font-weight:400}
#detail .dlink{color:var(--accent);cursor:pointer;text-decoration:underline}

@media(max-width:700px){
  header{padding:16px 18px 14px}
  .controls{margin-left:0}
  .canvas{padding:60px 40px}
}
</style></head>
<body>
<header>
  <div class="kicker">Family Archive</div>
  <h1>Prabhu Family Tree</h1>
  <div class="subtitle">A living record of the Prabhu family &mdash; click anyone for details</div>
  <div class="toolbar">
    <div class="searchwrap">
      <input id="search" type="text" placeholder="Search a name…" autocomplete="off">
      <div id="searchResults"></div>
    </div>
    <label class="toggle"><input type="checkbox" id="toggleUnknown" checked> Hide unnamed placeholders</label>
    <div class="controls">
      <button id="out">−</button><button id="reset">100%</button><button id="in">+</button><button id="fit">Fit tree</button>
    </div>
  </div>
</header>
<main class="viewport" id="viewport"><div class="canvas" id="canvas"><div class="tree" id="tree"></div></div></main>

<div id="overlay"></div>
<div id="detail">
  <button class="dclose" id="dclose" aria-label="Close">&times;</button>
  <div class="drel" id="d-rel"></div>
  <h2 id="d-name"></h2>
  <div class="dyears" id="d-years"></div>
  <div class="drow" id="d-parent"></div>
  <div class="drow" id="d-children"></div>
</div>

<script src="family-data.js"></script>
<script>
const data=window.FAMILY_DATA||[], byId=Object.fromEntries(data.map(p=>[p.id,p])), tree=document.getElementById("tree");

function parentOf(id){ return data.find(p=>(p.children||[]).includes(id)) || null; }
function yrs(p){return p.birth||p.death?`${p.birth||"—"}–${p.death||"—"}`:"—"}
function rel(parent,child){return child.gender==="female"?"Daughter":child.gender==="male"?"Son":"Child"}
function isPlaceholder(p){ return p.name==="Unknown" && !(p.children&&p.children.length); }

function card(p,label=""){
  let d=document.createElement("div");
  d.className="person";
  d.dataset.id=p.id;
  if(isPlaceholder(p)) d.dataset.unknown="true";
  d.innerHTML=`<div class="relation">${label}</div>`+
    `<div class="photo"><img src="photos/${p.id}.jpg" alt="" loading="lazy" `+
    `onload="this.parentElement.classList.add('has-photo')" onerror="this.remove()"></div>`+
    `<div class="name">${p.name}</div><div class="years">${yrs(p)}</div>`;
  d.addEventListener("click",(e)=>{ e.stopPropagation(); openDetail(p,label); });
  return d;
}
function branch(parent){
  let kids=(parent.children||[]).map(x=>byId[x]).filter(Boolean);
  if(!kids.length) return null;
  let f=document.createElement("div"); f.className="family";
  let row=document.createElement("div"); row.className="children";
  kids.forEach(k=>row.appendChild(card(k,rel(parent,k))));
  f.appendChild(row);
  kids.forEach(k=>{
    if(k.children?.length){
      let n=document.createElement("div"); n.className="nested";
      n.appendChild(branch(k)); f.appendChild(n);
    }
  });
  return f;
}
let root=byId.padmanabh;
if(!Array.isArray(data) || !data.length || !root){
  tree.innerHTML = `<div style="max-width:520px;padding:40px 20px;color:#7c7467;font:15px/1.6 Georgia,serif">
    <b>The family data didn't load.</b><br><br>
    This page expects a file called <code>family-data.js</code> to sit in the exact same folder as
    <code>index.html</code>, and to start with <code>window.FAMILY_DATA = family;</code> at the end.<br><br>
    Check on GitHub that <code>family-data.js</code> exists, is spelled exactly like that, and hasn't been
    accidentally emptied or overwritten &mdash; then reload this page.
  </div>`;
} else {
  let r=document.createElement("div"); r.className="generation root";
  r.appendChild(card(root,"Founder"));
  tree.append(r,branch(root));
}

/* zoom + pan */
let scale=1,canvas=document.getElementById("canvas"),vp=document.getElementById("viewport");
const btnIn=document.getElementById("in"),btnOut=document.getElementById("out"),btnReset=document.getElementById("reset"),btnFit=document.getElementById("fit");
function apply(){canvas.style.transform=`scale(${scale})`;btnReset.textContent=Math.round(scale*100)+"%"}
btnIn.onclick=()=>{scale=Math.min(1.7,scale+.1);apply()};
btnOut.onclick=()=>{scale=Math.max(.45,scale-.1);apply()};
btnReset.onclick=()=>{scale=1;apply()};
btnFit.onclick=()=>{scale=Math.max(.45,Math.min(1,(vp.clientWidth-30)/canvas.scrollWidth,(vp.clientHeight-30)/canvas.scrollHeight));apply();vp.scrollTo(0,0)};

let drag=false,sx,sy,sl,st;
vp.onpointerdown=e=>{drag=true;vp.classList.add("dragging");sx=e.clientX;sy=e.clientY;sl=vp.scrollLeft;st=vp.scrollTop;vp.setPointerCapture(e.pointerId)};
vp.onpointermove=e=>{if(drag){vp.scrollLeft=sl-e.clientX+sx;vp.scrollTop=st-e.clientY+sy}};
vp.onpointerup=()=>{drag=false;vp.classList.remove("dragging")};

/* hide/show unnamed placeholders */
const toggleUnknown=document.getElementById("toggleUnknown");
function applyToggle(){ tree.classList.toggle("hide-unknown", toggleUnknown.checked); }
toggleUnknown.addEventListener("change",applyToggle);
applyToggle();

/* detail panel */
const overlay=document.getElementById("overlay"), panel=document.getElementById("detail");
function openDetail(p,label){
  document.getElementById("d-rel").textContent = label || (p.id==="padmanabh" ? "Founder" : "Family member");
  document.getElementById("d-name").textContent = p.name;
  document.getElementById("d-years").textContent = yrs(p);
  let par=parentOf(p.id);
  document.getElementById("d-parent").innerHTML = par
    ? `<b>Parent:</b> <span class="dlink" data-goto="${par.id}">${par.name}</span>`
    : `<b>Parent:</b> — (root of the tree)`;
  let kids=(p.children||[]).map(x=>byId[x]).filter(Boolean);
  document.getElementById("d-children").innerHTML = kids.length
    ? `<b>Children (${kids.length}):</b> ` + kids.map(k=>`<span class="dlink" data-goto="${k.id}">${k.name}</span>`).join(", ")
    : `<b>Children:</b> none recorded`;
  overlay.classList.add("open"); panel.classList.add("open");
}
function closeDetail(){ overlay.classList.remove("open"); panel.classList.remove("open"); }
document.getElementById("dclose").onclick=closeDetail;
overlay.onclick=closeDetail;
panel.addEventListener("click",e=>{
  let go=e.target.closest("[data-goto]");
  if(go){ closeDetail(); locate(go.dataset.goto); }
});

/* locate + highlight a person on the tree */
function locate(id){
  let el=tree.querySelector(`[data-id="${id}"]`);
  if(!el) return;
  if(el.dataset.unknown==="true" && toggleUnknown.checked){ toggleUnknown.checked=false; applyToggle(); }
  el.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
  el.classList.add("highlight");
  setTimeout(()=>el.classList.remove("highlight"),1500);
}

/* search */
const searchInput=document.getElementById("search"), resultsBox=document.getElementById("searchResults");
function runSearch(){
  let q=searchInput.value.trim().toLowerCase();
  if(!q){ resultsBox.style.display="none"; resultsBox.innerHTML=""; return; }
  let matches=data.filter(p=>p.name!=="Unknown" && p.name.toLowerCase().includes(q)).slice(0,8);
  if(!matches.length){
    resultsBox.innerHTML=`<div class="none">No matches</div>`;
  } else {
    resultsBox.innerHTML=matches.map(p=>{
      let par=parentOf(p.id);
      return `<div data-id="${p.id}">${p.name}${par?`<span class="rel">child of ${par.name}</span>`:""}</div>`;
    }).join("");
  }
  resultsBox.style.display="block";
}
searchInput.addEventListener("input",runSearch);
searchInput.addEventListener("focus",runSearch);
resultsBox.addEventListener("click",e=>{
  let row=e.target.closest("[data-id]");
  if(!row) return;
  let p=byId[row.dataset.id];
  searchInput.value=p.name;
  resultsBox.style.display="none";
  locate(p.id);
  let par=parentOf(p.id);
  openDetail(p, par?rel(par,p):"Founder");
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".searchwrap")) resultsBox.style.display="none";
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ resultsBox.style.display="none"; closeDetail(); } });
</script>
</body></html>
