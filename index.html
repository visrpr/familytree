<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prabhu Family Tree</title>
<style>
:root{--ink:#29261f;--muted:#7c7467;--paper:#f5f1e8;--card:#fffdf8;--line:#b9ab91;--accent:#987948}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}body{overflow:hidden}
header{height:112px;padding:25px 32px;border-bottom:1px solid #ded5c5;background:#f5f1e8;position:relative;z-index:3}
.kicker{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1{font:400 clamp(28px,4vw,44px) Georgia,serif;margin:4px 0}.subtitle{font-size:12px;color:var(--muted)}
.controls{position:absolute;right:28px;bottom:25px;display:flex;gap:6px}button{border:1px solid #d8cfbf;background:#fffdf8;border-radius:9px;padding:8px 11px;color:var(--ink);cursor:pointer}
.viewport{height:calc(100vh - 112px);overflow:auto;cursor:grab}.viewport.dragging{cursor:grabbing}.canvas{min-width:3000px;min-height:1900px;padding:90px 100px;transform-origin:top left}
.tree{display:flex;flex-direction:column;align-items:center;gap:70px}.generation{display:flex;justify-content:center;gap:30px}
.person{width:150px;text-align:center;position:relative}.photo{width:108px;height:108px;margin:auto;border-radius:50%;border:1px solid #bba98b;background:linear-gradient(145deg,#e2dccf,#c1b6a1);position:relative;box-shadow:0 9px 22px #493a2815}
.photo:before{content:"";position:absolute;left:40%;top:24%;width:21%;height:21%;border-radius:50%;background:#8e8575aa}.photo:after{content:"";position:absolute;left:27%;bottom:11%;width:46%;height:42%;border-radius:50% 50% 42% 42%;background:#8e857566}
.name{font:400 15px/1.25 Georgia,serif;margin-top:11px;min-height:38px}.years{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:3px}.relation{font-size:8px;text-transform:uppercase;letter-spacing:.16em;color:#9a8768;height:13px;margin-bottom:5px}
.root .person{width:190px}.root .photo{width:145px;height:145px}.root .name{font-size:20px}
.family{position:relative;padding-top:68px}.family:before{content:"";position:absolute;top:0;left:50%;height:68px;border-left:1px solid var(--line)}
.children{display:flex;gap:26px;justify-content:center;position:relative}.children:before{content:"";position:absolute;top:0;left:4%;right:4%;height:1px;background:var(--line)}.children .person:before{content:"";position:absolute;top:-68px;left:50%;height:68px;border-left:1px solid var(--line)}
.nested{margin-top:78px}.nested>.family{padding-top:55px}.nested>.family:before{height:55px}.nested .children .person:before{top:-55px;height:55px}
@media(max-width:700px){header{height:130px;padding:18px}.controls{left:18px;right:auto;bottom:16px}.viewport{height:calc(100vh - 130px)}.canvas{padding:60px 40px}}
</style></head>
<body><header><div class="kicker">Family Archive</div><h1>Prabhu Family Tree</h1><div class="subtitle">A living record of the Prabhu family</div><div class="controls"><button id="zoomout">−</button><button id="zoomreset">100%</button><button id="zoomin">+</button><button id="fittree">Fit tree</button></div></header>
<main class="viewport" id="viewport"><div class="canvas" id="canvas"><div class="tree" id="tree"></div></div></main>
<script src="family-data.js"></script>
<script>
const data=window.FAMILY_DATA||[], byId=Object.fromEntries(data.map(p=>[p.id,p])), tree=document.getElementById("tree");
function yrs(p){return p.birth||p.death?`${p.birth||"—"}–${p.death||"—"}`:"—"}
function rel(parent,child){return child.gender==="female"?"Daughter":child.gender==="male"?"Son":"Child"}
function card(p,label=""){let d=document.createElement("div");d.className="person";d.innerHTML=`<div class="relation">${label}</div><div class="photo"></div><div class="name">${p.name}</div><div class="years">${yrs(p)}</div>`;return d}
function branch(parent){let kids=(parent.children||[]).map(x=>byId[x]).filter(Boolean);if(!kids.length)return null;let f=document.createElement("div");f.className="family";let row=document.createElement("div");row.className="children";kids.forEach(k=>row.appendChild(card(k,rel(parent,k))));f.appendChild(row);kids.forEach(k=>{if(k.children?.length){let n=document.createElement("div");n.className="nested";n.appendChild(branch(k));f.appendChild(n)}});return f}
let root=byId.padmanabh;let r=document.createElement("div");r.className="generation root";r.appendChild(card(root));tree.append(r,branch(root));
let scale=1,canvas=document.getElementById("canvas"),vp=document.getElementById("viewport");function apply(){canvas.style.transform=`scale(${scale})`;document.getElementById("reset").textContent=Math.round(scale*100)+"%"}
document.getElementById("zoomin").addEventListener("click", function () {
  scale = Math.min(1.7, scale + 0.1);
  apply();
});

document.getElementById("zoomOut").addEventListener("click", function () {
  scale = Math.max(0.45, scale - 0.1);
  apply();
});

document.getElementById("zoomReset").addEventListener("click", function () {
  scale = 1;
  apply();
});

document.getElementById("fitTree").addEventListener("click", function () {
  scale = Math.max(
    0.45,
    Math.min(
      1,
      (vp.clientWidth - 30) / canvas.scrollWidth,
      (vp.clientHeight - 30) / canvas.scrollHeight
    )
  );
  apply();
  vp.scrollTo(0, 0);
});
let drag=false,sx,sy,sl,st;vp.onpointerdown=e=>{drag=true;vp.classList.add("dragging");sx=e.clientX;sy=e.clientY;sl=vp.scrollLeft;st=vp.scrollTop;vp.setPointerCapture(e.pointerId)};vp.onpointermove=e=>{if(drag){vp.scrollLeft=sl-e.clientX+sx;vp.scrollTop=st-e.clientY+sy}};vp.onpointerup=()=>{drag=false;vp.classList.remove("dragging")};
</script></body></html>
